name: Daily content run

on:
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's video(s)
        run: python scripts/generate_video.py --count 1
      - name: Commit generated video(s) to the repo
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-generated content $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Instagram (only if secrets are configured)
        if: steps.commit.outputs.changed == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "IG_ACCESS_TOKEN not set, skipping Instagram post."
            exit 0
          fi
          for f in output/*.mp4; do
            base=$(basename "$f" .mp4)
            [ -f "output/$base.txt" ] || continue
            caption=$(cat "output/$base.txt")
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/output/$base.mp4"
            python poster/instagram_post.py "$url" "$caption"
          done

      - name: Queue to TikTok inbox (only if secrets are configured)
        if: steps.commit.outputs.changed == 'true'
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          if [ -z "$TIKTOK_ACCESS_TOKEN" ]; then
            echo "TIKTOK_ACCESS_TOKEN not set, skipping TikTok post."
            exit 0
          fi
          for f in output/*.mp4; do
            base=$(basename "$f" .mp4)
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/output/$base.mp4"
            python poster/tiktok_post.py "$url" "$base"
          done
