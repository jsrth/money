name: Daily content run

on:
  schedule:
    # 3x/day, spread across peak engagement windows for a US/UK-leaning
    # English audience (cron is UTC):
    #   12:00 UTC -> ~8am ET / 1pm London   (morning commute/scroll)
    #   16:00 UTC -> ~12pm ET / 5pm London  (lunch break)
    #   23:00 UTC -> ~7pm ET / midnight London (evening prime time)
    # Each run generates + posts ONE video from the rotation, so 3 runs/day
    # = 3 fresh posts/day. Edit freely — these are reasonable defaults,
    # not a guarantee; watch your own analytics after a couple of weeks
    # and shift the times toward whenever your actual audience is active.
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate today's video(s)
        run: python scripts/generate_video.py --count 1

      - name: Commit generated video(s) to the repo
        id: commit
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-generated content $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post to Instagram (only if secrets are configured)
        if: steps.commit.outputs.changed == 'true' && secrets.IG_ACCESS_TOKEN != ''
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          for f in output/*.mp4; do
            base=$(basename "$f" .mp4)
            [ -f "output/$base.txt" ] || continue
            caption=$(cat "output/$base.txt")
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/output/$base.mp4"
            python poster/instagram_post.py "$url" "$caption"
          done

      - name: Queue to TikTok inbox (only if secrets are configured)
        if: steps.commit.outputs.changed == 'true' && secrets.TIKTOK_ACCESS_TOKEN != ''
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          for f in output/*.mp4; do
            base=$(basename "$f" .mp4)
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/output/$base.mp4"
            python poster/tiktok_post.py "$url" "$base"
          done
